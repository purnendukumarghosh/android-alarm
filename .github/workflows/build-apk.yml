name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an older build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
      # SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD repository secrets to sign
      # every build with the same private key (lets new builds install over
      # old ones). Without them the APK is signed with a throwaway debug key.
      - name: Decode signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk VoiceAlarm.apk

      # Unit tests: renders every screen with Robolectric (also a crash smoke
      # test) and checks the audio resampling / downmix maths.
      - name: Unit + screenshot tests
        id: screenshots
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAlarm-apk
          path: VoiceAlarm.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-test-report
          path: |
            app/build/screenshots/
            app/build/reports/tests/
          if-no-files-found: ignore

      # Only replace the downloadable APK when every screen rendered without crashing.
      - name: Publish as the "latest" GitHub release
        if: steps.screenshots.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest VoiceAlarm.apk \
            --target "${{ github.sha }}" \
            --title "Voice Alarm (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Open this page on your phone, download VoiceAlarm.apk and tap it to install." \
            --latest

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(app/build/screenshots/*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "No screenshots"; exit 0; fi
          gh release delete screenshots --cleanup-tag --yes || true
          gh release create screenshots "${files[@]}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "UI screenshots (build ${{ github.run_number }})" \
            --notes "Screens rendered by Robolectric from ${{ github.sha }} (screenshot tests: ${{ steps.screenshots.outcome }})."

  # Runs the video → audio converter against real test videos with the
  # platform codecs of an Android emulator.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Converter tests on an emulator (Android 11)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
